; PlatformIO Project Configuration File
;
; examples/ 配下のサブフォルダごとに1つの env を割り当てる構成。
;   pio run -e gnss-imu-sender          # ビルド
;   pio run -e gnss-imu-sender -t upload # 書き込み
;   pio run -e UDPsender -t monitor      # シリアルモニタ
;
; 新しいサンプルを追加するとき:
;   1. examples/<name>/<name>.cpp を作成 (.ino ではなく .cpp。Arduino.h を include)
;   2. 下に [env:<name>] を追加し build_src_filter で対象フォルダを指定
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = examples
default_envs = gnss-imu-sender

; すべての env で共通の設定
[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
lib_deps =
	sparkfun/SparkFun u-blox GNSS v3@^3.1.13
	sparkfun/SparkFun BMI270 Arduino Library@^1.0.3
	https://github.com/Bill2462/PCF8563-Arduino-Library.git
	greiman/SdFat@^2.3.1

[env:gnss-imu-sender]
build_src_filter = -<*> +<gnss-imu-sender/>

; SD カード書き込みなし版 (Core 0 は送信タスクのみ)
[env:gnss-imu-sender-no-sdwriting]
build_src_filter = -<*> +<gnss-imu-sender-no-sdwriting/>

[env:UDPsender]
build_src_filter = -<*> +<UDPsender/>
